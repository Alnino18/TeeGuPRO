<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>TeeGu - Заказ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
    :root {
    --bg: var(--tg-theme-bg-color, #09090f);
    --bg2: var(--tg-theme-secondary-bg-color, #12121e);
    --text: var(--tg-theme-text-color, #f5f5fc);
    --text2: var(--tg-theme-hint-color, #a3a3c2);
    --accent: var(--tg-theme-button-color, #7b61ff);
    --accent2: #00e5ff;
    --border: var(--tg-theme-secondary-bg-color, #2a2a46);
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 80px; }
  .header { padding: 15px; background: rgba(25, 25, 35, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; }
  .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(25, 25, 35, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 15px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); }
  .cart-total { font-weight: 800; font-size: 18px; color: var(--accent2); }
  .btn-order { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; animation: cartPulse 2s infinite ease-in-out; box-shadow: 0 4px 20px rgba(124,106,247,0.4); }
  .btn-order:active { transform: scale(0.95); }
  #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 1000; display:flex; align-items:center; justify-content:center; font-weight:800; font-family: 'Outfit', sans-serif; font-size: 20px;}
  #loginScreen { padding: 20px; text-align: center; padding-top: 80px; }
  .form-group { margin-bottom: 16px; }
  .btn-repeat { background: rgba(123, 97, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%; margin-top: 10px; }
  .btn-repeat:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="loading">Загрузка...</div>



<!-- Экран меню -->
<div id="menuScreen" style="display:none">
  <div class="header">🥗 TeeGu</div>
  <div class="tabs" style="justify-content:center; background:rgba(25, 25, 35, 0.85); backdrop-filter:blur(12px);">
    <div class="tab active" onclick="switchClientTab('menu')" id="tab-menu">🥗 Меню</div>
    <div class="tab" onclick="switchClientTab('orders')" id="tab-orders">📦 Мои заказы</div>
  </div>
  
  <div id="client-page-menu" style="padding:15px">
    <div class="tabs" id="categoryTabs" style="margin-bottom:15px; padding:0; background:transparent; border:none; gap:8px;">
      <div class="tab active" onclick="filterCategory('all')" style="background:var(--bg2); border-radius:12px; padding:8px 16px; border:1px solid var(--border);">Barchasi</div>
      <div class="tab" onclick="filterCategory('fastfood')" style="background:var(--bg2); border-radius:12px; padding:8px 16px; border:1px solid var(--border);">Fast-fud</div>
      <div class="tab" onclick="filterCategory('drinks')" style="background:var(--bg2); border-radius:12px; padding:8px 16px; border:1px solid var(--border);">Ichimliklar</div>
    </div>
    <div id="productsGrid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px;"></div>
  </div>
  
  <div id="client-page-orders" style="display:none; padding:15px">
    <div id="clientOrdersList"></div>
  </div>

  <div class="cart-bar" id="cartBar" style="display:none">
    <div>
      <div style="font-size:12px; color:var(--text2)">Итого к оплате:</div>
      <div class="cart-total" id="cartTotal">0 сум</div>
    </div>
    <button class="btn-order" onclick="placeOrder()">Заказать</button>
  </div>
</div>

<!-- Модалка оформления -->
<div id="checkoutOverlay" class="modal-overlay">
  <div id="checkoutModal" class="modal">
    <div class="modal-content">
      <h3>Подтверждение заказа</h3>
      <div class="form-group">
        <label class="form-label">Ваше имя</label>
        <input type="text" id="orderName" class="form-input" placeholder="Имя...">
      </div>
      <div class="form-group">
        <label class="form-label">Ваш телефон</label>
        <input type="text" id="orderPhone" class="form-input" placeholder="+998 90 123 45 67">
      </div>
      <div class="form-group">
        <label class="form-label">Адрес доставки / Lokatsiya</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="orderAddress" class="form-input" placeholder="Город, улица, дом..." style="flex:1">
          <button class="btn btn-outline" onclick="openClientMap()" style="padding:0 15px; font-size:18px">📍</button>
        </div>
        <div id="locationStatus" style="font-size:11px; color:var(--green); margin-top:4px; display:none">✅ Lokatsiya tanlandi</div>
      </div>
      <div class="form-group">
        <label class="form-label">Примечание к заказу</label>
        <input type="text" id="orderNote" class="form-input" placeholder="Например: без лука">
      </div>
      <div class="form-group">
        <label class="form-label">Тип оплаты / To'lov turi</label>
        <select id="orderPayment" class="form-input" style="appearance: none; padding-right: 30px; background: var(--bg2) url('data:image/svg+xml;utf8,<svg fill=%22%237c6af7%22 height=%2224%22 viewBox=%220 0 24 24%22 width=%2224%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M7 10l5 5 5-5z%22/></svg>') no-repeat right 10px center;">
          <option value="наличные">💵 Наличные (Naqd)</option>
          <option value="клик">📱 Карта (Click/Payme)</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px">
        <button class="btn btn-secondary" onclick="closeCheckout()">Отмена</button>
        <button class="btn btn-primary" onclick="submitOrder()" id="submitBtn">Подтвердить заказ</button>
      </div>
    </div>
  </div>
</div>


<!-- MODAL: CLIENT MAP -->
<div id="clientMapOverlay" class="modal-overlay" style="z-index: 2000;">
  <div class="modal" style="height: 80vh; display: flex; flex-direction: column;">
    <div class="modal-content" style="flex: 1; display: flex; flex-direction: column; padding: 15px;">
      <h3 style="margin-top:0">📍 Lokatsiyani belgilang</h3>
      <p style="font-size:12px; color:var(--text2); margin-bottom:10px">Xaritani surib, manzilingizni markazga keltiring</p>
      <div style="position:relative; flex:1; border-radius:12px; overflow:hidden; border:1px solid var(--border)">
        <div id="clientYandexMap" style="width:100%; height:100%;"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -100%); pointer-events:none; z-index:1000; font-size:32px;">📍</div>
      </div>
      <div style="display:flex; gap:10px; margin-top:15px">
        <button class="btn btn-secondary" onclick="closeClientMap()">Bekor qilish</button>
        <button class="btn btn-primary" onclick="confirmClientMap()">Tasdiqlash</button>
      </div>
    </div>
  </div>
</div>

<script src="client.js?v=15"></script>
</body>
</html>
